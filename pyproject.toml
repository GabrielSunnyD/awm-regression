[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awm-exposure"
version = "0.1.0"
description = "Build a municipality-level Austrian waste-cartel exposure indicator"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
awm-exposure = "awm_exposure.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

