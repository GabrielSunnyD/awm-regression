[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awm-exposure"
version = "0.2.0"
description = "Build a municipality-level Austrian waste-cartel exposure indicator"
requires-python = ">=3.12"
dependencies = [
    "httpx[socks]>=0.28.1,<1",
    "pyshp>=2.3.1,<3",
]

[project.scripts]
awm-exposure = "awm_exposure.cli:main"
awm-sources = "awm_exposure.source_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true
